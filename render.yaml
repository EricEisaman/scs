# render.yaml -- Render STATIC deploy. Client only.
#
# Use this file when you want Render to serve the SCS frontend
# with no server at all. Render serves index.html + scs_*.py +
# apps/ as files. Brython fetches .py at runtime.
#
# What is NOT here on purpose:
#   No Dockerfile, no PORT, no /healthz, no SESSION_SECRET,
#   no CHAT_* env vars, no ALLOWED_ORIGINS. A static site has
#   no server to read them. If you need chat / session / API,
#   use render.docker.yaml instead.
#
# To deploy: Render -> New -> Blueprint -> pick this repo.
# Blueprint file is render.yaml (the default).
# For Docker instead, use Blueprint file render.docker.yaml.

services:
  - type: web
    name: scs-static
    env: static
    buildCommand: ""
    staticPublishPath: ./
    autoDeploy: false
    routes:
      - type: rewrite
        source: /sandbox
        destination: /sandbox.html
      - type: rewrite
        source: /sandbox/
        destination: /sandbox.html
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: Cache-Control
        value: no-store
