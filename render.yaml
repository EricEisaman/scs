services:
  - type: web
    name: scs-207
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    healthCheckPath: /healthz
    autoDeploy: false
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: PORT
        value: "10000"
      - key: ALLOWED_ORIGINS
        value: "https://ericeisaman.github.io,https://scs-207.onrender.com,http://localhost:8000,https://scs-2qah.onrender.com"
      - key: SESSION_SECRET
        generateValue: true
      - key: CHAT_UPSTREAM_URL
        value: https://chat-slayer.onrender.com
      - key: CHAT_PROXY_PREFIX
        value: /chat-api
      - key: CHAT_CLIENT_ID
        value: web-demo

