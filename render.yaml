services:
  # Your existing datastar extension - KEEP AS IS
  - type: web
    name: scs-datastar-extension
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    healthCheckPath: /healthz
    autoDeploy: false
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: PORT
        value: "10000"
      - key: ALLOWED_ORIGINS
        value: "https://ericeisaman.github.io,https://scs-207.onrender.com,http://localhost:8000,https://scs-2qah.onrender.com"
      - key: SESSION_SECRET
        generateValue: true

  # NEW: Static site that serves EVERYTHING - index.html, sandbox.html, PROCAUDIO.html, scs.py, apps/, extensions/
  # This is what you asked for - CDN clears immediately on deploy
  - type: web
    name: scs
    env: static
    buildCommand: ""
    staticPublishPath: ./
    autoDeploy: true
    routes:
      - type: rewrite
        source: /sandbox
        destination: /sandbox.html
      - type: rewrite
        source: /sandbox/
        destination: /sandbox.html
      - type: rewrite
        source: /proc-audio
        destination: /PROCAUDIO.html
      - type: rewrite
        source: /PROCAUDIO
        destination: /PROCAUDIO.html
      - type: rewrite
        source: /procaudio
        destination: /PROCAUDIO.html
    headers:
      - path: /scs.py
        name: Content-Type
        value: text/plain; charset=utf-8
      - path: /extensions.py
        name: Content-Type
        value: text/plain; charset=utf-8
      - path: /apps/*.py
        name: Content-Type
        value: text/plain; charset=utf-8
      - path: /extensions/*.py
        name: Content-Type
        value: text/plain; charset=utf-8
      - path: /scs.py
        name: Cache-Control
        value: public, max-age=0, must-revalidate
      - path: /apps/*
        name: Cache-Control
        value: public, max-age=0, must-revalidate
      - path: /extensions/*
        name: Cache-Control
        value: public, max-age=0, must-revalidate
      - path: /*.html
        name: Cache-Control
        value: public, max-age=0, must-revalidate

