<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>SCS</title>
<style>
body{margin:0;padding:0;background:#0f1115;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;}
#toolbar{display:flex;gap:8px;align-items:center;margin-bottom:10px;color:#e6e6e6;font-family:monospace;font-size:12px;}
#toolbar select,#toolbar button{background:#1a1d24;color:#e6e6e6;border:1px solid #3a3f4b;border-radius:6px;padding:6px 10px;cursor:pointer;}
#scs-status{color:#8b93a5;}
#canvas-container{border:2px solid #3a3f4b;border-radius:8px;background:#000;overflow:hidden;box-shadow:0 0 30px rgba(0,0,0,0.6);}
canvas{display:block;background:black;outline:none;}
</style>
<script src="https://cdn.jsdelivr.net/npm/brython@3.11.3/brython.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/brython@3.11.3/brython_stdlib.js"></script>
<script>window.SCS_CONFIG = window.SCS_CONFIG || {};</script>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="icon" href="favicon.png">
</head>
<body onload="brython({debug:1, pythonpath:['scs', '.']})">
<div id="toolbar">
<label>Renderer <select id="renderer-select"><option value="auto">auto</option><option value="2d">2d</option><option value="webgl2">webgl2</option><option value="webgpu">webgpu</option></select></label>
<button id="xr-btn">Enter XR</button>
<button id="fullscreen-btn">Fullscreen</button>
<span id="scs-status"></span>
</div>
<div id="canvas-container"><canvas id="cmu-canvas" width="1050" height="700" tabindex="0"></canvas></div>
<script>
// pythonpath is ['scs', '.']: package branch, publish /. Canonical
// modules live in scs/ (scs/scs_3d.py), entrypoint + scs.py at root.
// scs/ FIRST so scs_3d resolves on the first try, no ./scs_3d.py 404,
// no chance to parse HTML as Python.
// Toolbar only: reflect ?renderer= in the select. Renderer selection
// itself lives in scs_entrypoint (_resolve_renderer_kind); changing
// the select reloads with ?renderer=, it does not reimplement selection.
(function(){try{var q=new URLSearchParams(window.location.search);var v=q.get('renderer')||window.SCS_CONFIG.renderer||'auto';document.getElementById('renderer-select').value=v;var app=q.get('app')||'(default apps/app.py)';document.getElementById('scs-status').textContent='app='+app+' renderer='+v;}catch(e){}})();
</script>
<script type="text/python" id="main">
# Thin shell only. No loop, no events, no renderer, no app loading here:
# all of that lives in scs_entrypoint.py. This file wires the toolbar
# to the entrypoint and calls boot().
from browser import document, window, timer
import scs_entrypoint as ep

_status = document['scs-status']

def _set_status(msg):
    try:
        _status.text = str(msg)
    except Exception:
        pass

def _on_renderer_change(ev):
    # Reload with ?renderer= -- but PRESERVE every other param, above
    # all ?app=. The old bug: rebuilding the query as '?renderer=...'
    # dropped ?app=, so the URL param "disappeared" and the page fell
    # back to apps/app.py. Build from the CURRENT search, change only
    # the renderer key.
    try:
        val = document['renderer-select'].value or 'auto'
        p = window.URLSearchParams.new(window.location.search)
        p.set('renderer', val)
        # Keep ?app= (and anything else) exactly as it was.
        window.location.search = '?' + p.toString()
    except Exception:
        pass

def _on_xr(ev):
    try:
        ep.startXR()
        _set_status('XR: ' + str(ep.getXRState()))
    except Exception as e:
        _set_status('XR unavailable: ' + str(e))

def _on_fullscreen(ev):
    try:
        st = ep.getFullscreenState() or {}
        if st.get('is_fullscreen'):
            ep.exitFullscreen()
        else:
            ep.enterFullscreen()
    except Exception as e:
        _set_status('Fullscreen unavailable: ' + str(e))

def _refresh_status():
    try:
        _set_status('renderer=' + str(ep.getRendererKind()) +
                    ' xr=' + str(ep.getXRState()))
    except Exception:
        pass

document['renderer-select'].bind('change', _on_renderer_change)
document['xr-btn'].bind('click', _on_xr)
document['fullscreen-btn'].bind('click', _on_fullscreen)
timer.set_interval(_refresh_status, 500)

ep.boot()
</script>
</body></html>
