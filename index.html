<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>SCS</title>
<style>
body{margin:0;padding:0;background:#0f1115;display:flex;align-items:center;justify-content:center;min-height:100vh;}
canvas{display:block;background:black;outline:none;}
</style>
<!-- SCS from CDN: users just import from npm or load from CDN. No app code here. -->
<script src="https://cdn.jsdelivr.net/npm/brython@3.11.3/brython.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/brython@3.11.3/brython_stdlib.js"></script>
</head>
<body onload="brython({debug:1, pythonpath:['.', 'scs']})">
<!-- Top level: point to a valid app. Change data-app to your app file, nothing else. -->
<canvas id="canvas" data-app="apps/app.py" width="1050" height="700" tabindex="0"></canvas>
<script type="text/python">
# Thin shell only. No loop, no events, no renderer, no shape drawing here.
# All of that is baked into the package (scs_entrypoint.py).
# Users just import from npm or load from CDN.
import scs_entrypoint as ep
# Top level: point to a valid app. boot() reads data-app above.
# Or: ep.boot("myapp.py") - same, explicit.
ep.boot()
</script>
</body></html>
