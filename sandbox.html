<textarea id="code-input">from scs import *
from math import sin, cos, atan2, sqrt, pi


# ==============================================================
# THE EXACT METHOD OF AEROFOIL DESIGN
# JOUKOWSKI CONFORMAL-MAPPING WIND TUNNEL
#
# CMU CS Academy CPCS Mode
# Canvas: 1050 x 700
#
# VISUAL CONVENTION
# --------------------------------------------------------------
# The wind remains horizontal, moving left to right.
# The aerofoil and mapped flow geometry visibly rotate.
# The rotation angle is the displayed angle of attack alpha.
#
# CONTROLS
# --------------------------------------------------------------
# Drag gold handle : Move generating circle / change camber
# W / S            : Increase / decrease circulation
# A / D            : Rotate aerofoil down / up
# Q / E            : Make generating circle smaller / larger
# 1                : Symmetric preset
# 2                : Cambered preset
# 3                : High-lift preset
# SPACE            : Pause / resume tracer particles
# R                : Reset
# H                : Help
# ==============================================================


# --------------------------------------------------------------
# Utility functions
# --------------------------------------------------------------

def clamp(value, low, high):
    if value < low:
        return low
    elif value > high:
        return high
    return value


def distanceBetween(x1, y1, x2, y2):
    return sqrt((x2 - x1) ** 2 + (y2 - y1) ** 2)


def sourceToScreen(app, x, y):
    return (
        app.sourceCenterX + x * app.sourceScale,
        app.sourceCenterY - y * app.sourceScale
    )


def mappedToScreen(app, x, y):
    return (
        app.mappedCenterX + x * app.mappedScale,
        app.mappedCenterY - y * app.mappedScale
    )


def screenToSource(app, screenX, screenY):
    return (
        (screenX - app.sourceCenterX) / app.sourceScale,
        (app.sourceCenterY - screenY) / app.sourceScale
    )


def rotatePoint(x, y, pivotX, pivotY, angleRadians):
    dx = x - pivotX
    dy = y - pivotY

    rotatedX = pivotX + dx * cos(angleRadians) - dy * sin(angleRadians)
    rotatedY = pivotY + dx * sin(angleRadians) + dy * cos(angleRadians)

    return (rotatedX, rotatedY)


def joukowskiMap(x, y):
    # w = z + 1/z
    denominator = x * x + y * y

    if denominator < 0.0001:
        denominator = 0.0001

    return (
        x + x / denominator,
        y - y / denominator
    )


# --------------------------------------------------------------
# Fast cached source and mapped geometry
# --------------------------------------------------------------

def getBaseStreamlinePoint(app, level, theta):
    radius = app.circleRadius

    radialOffset = 0.22 + abs(level) * 0.46
    noseBend = 0.46 * (1 - cos(theta))
    sideBend = 0.16 * sin(theta) * sin(theta)

    radialDistance = radius + radialOffset + noseBend + sideBend

    x = app.circleX + radialDistance * cos(theta)
    y = app.circleY + radialDistance * sin(theta)

    # A qualitative circulation asymmetry.
    circulationShift = app.circulation * 0.13 * sin(theta)

    if level > 0:
        y += circulationShift
    else:
        y += circulationShift * 0.72

    return (x, y)


def buildOneStreamline(app, level):
    points = []

    if level > 0:
        startTheta = pi + 0.98
        endTheta = -0.98
    else:
        startTheta = pi - 0.98
        endTheta = 0.98

    startX = -3.45
    startY = level * 0.69 + app.circleY * 0.10
    points.append((startX, startY))

    steps = 50

    for step in range(steps + 1):
        fraction = step / steps
        theta = startTheta + (endTheta - startTheta) * fraction

        x, y = getBaseStreamlinePoint(app, level, theta)
        points.append((x, y))

    endX = 3.45
    endY = level * 0.69 + app.circleY * 0.10
    endY += app.circulation * 0.10
    points.append((endX, endY))

    return points


def rebuildCachedGeometry(app):
    # This runs only after an input change, never every onStep.

    app.sourceStreamlines = []
    app.mappedStreamlines = []

    levels = [
        -2.15, -1.72, -1.36, -1.04, -0.78, -0.54, -0.33,
         0.33,  0.54,  0.78,  1.04,  1.36,  1.72,  2.15
    ]

    for level in levels:
        sourceLine = buildOneStreamline(app, level)
        mappedLine = []

        for x, y in sourceLine:
            mappedX, mappedY = joukowskiMap(x, y)
            mappedLine.append((mappedX, mappedY))

        app.sourceStreamlines.append(sourceLine)
        app.mappedStreamlines.append(mappedLine)

    app.mappedAirfoilPoints = []

    pointCount = 180

    for index in range(pointCount + 1):
        theta = 2 * pi * index / pointCount

        sourceX = app.circleX + app.circleRadius * cos(theta)
        sourceY = app.circleY + app.circleRadius * sin(theta)

        mappedX, mappedY = joukowskiMap(sourceX, sourceY)
        app.mappedAirfoilPoints.append((mappedX, mappedY))

    # Cache leading and trailing edge coordinates in mapped world space.
    app.leadingEdge = app.mappedAirfoilPoints[0]
    app.trailingEdge = app.mappedAirfoilPoints[0]

    for point in app.mappedAirfoilPoints:
        if point[0] < app.leadingEdge[0]:
            app.leadingEdge = point

        if point[0] > app.trailingEdge[0]:
            app.trailingEdge = point

    # Rotation pivot: a point partway from leading to trailing edge.
    # Approximately a quarter-chord pivot works well visually.
    app.aerofoilPivotX = (
        app.leadingEdge[0] +
        0.28 * (app.trailingEdge[0] - app.leadingEdge[0])
    )

    app.aerofoilPivotY = (
        app.leadingEdge[1] +
        0.28 * (app.trailingEdge[1] - app.leadingEdge[1])
    )


# --------------------------------------------------------------
# Aerofoil display rotation
# --------------------------------------------------------------

def getRotatedMappedPoint(app, x, y):
    # In math coordinates, positive alpha should make the nose rise.
    # Screen y is inverted later by mappedToScreen, so use -alpha.
    angleRadians = -app.angleOfAttack * pi / 180

    return rotatePoint(
        x,
        y,
        app.aerofoilPivotX,
        app.aerofoilPivotY,
        angleRadians
    )


def getRotatedMappedScreenPoint(app, x, y):
    rotatedX, rotatedY = getRotatedMappedPoint(app, x, y)
    return mappedToScreen(app, rotatedX, rotatedY)

# Statistics
# --------------------------------------------------------------

def getDesignStats(app):
    camber = app.circleY * 32
    thickness = max(1.5, (app.circleRadius - 0.87) * 58)

    liftIndex = (
        app.circulation * 0.62 +
        app.angleOfAttack * 0.065 +
        camber * 0.085
    )

    if liftIndex >= 1.85:
        rating = 'ELITE LIFT'
        ratingColor = 'springGreen'
    elif liftIndex >= 1.25:
        rating = 'MISSION READY'
        ratingColor = 'gold'
    elif liftIndex >= 0.45:
        rating = 'LIFTING'
        ratingColor = 'lightGreen'
    elif liftIndex >= -0.20:
        rating = 'NEAR NEUTRAL'
        ratingColor = 'lightSteelBlue'
    else:
        rating = 'DOWNFORCE'
        ratingColor = 'tomato'

    return (camber, thickness, liftIndex, rating, ratingColor)


def getKuttaStatus(app):
    targetX = 1.0 - app.circleRadius
    targetY = 0

    error = distanceBetween(
        app.circleX,
        app.circleY,
        targetX,
        targetY
    )

    if error < 0.12:
        return ('TRAILING EDGE ALIGNED', 'springGreen')
    elif error < 0.30:
        return ('NEAR EDGE SETUP', 'gold')
    else:
        return ('EXPERIMENTAL PROFILE', 'tomato')

def resetApp(app):
    app.circleX = -0.10
    app.circleY = 0.13
    app.circleRadius = 1.10

    app.circulation = 0.55
    app.angleOfAttack = 0

    app.running = True
    app.showHelp = True
    app.draggingHandle = False

    app.particleOffset = 0

    app.message = 'Mission: rotate the aerofoil and study its mapped flow.'
    app.messageTimer = 180

    rebuildCachedGeometry(app)


def onAppStart(app):
    print("[DEBUG onAppStart] >>> ENTER")
    app.width = 1050
    app.height = 700
    app.stepsPerSecond = 30

    app.sourceCenterX = 265
    app.sourceCenterY = 365
    app.sourceScale = 97

    app.mappedCenterX = 786
    app.mappedCenterY = 365
    app.mappedScale = 130

    resetApp(app)


# --------------------------------------------------------------
# Drawing helpers

def drawPanel(x, y, width, height, fillColor, borderColor):
    drawRect(
        x, y, width, height,
        fill=fillColor,
        border=borderColor,
        borderWidth=2
    )


def drawArrow(x1, y1, x2, y2, color, opacity, lineWidth=2):
    drawLine(
        x1, y1, x2, y2,
        fill=color,
        lineWidth=lineWidth,
        opacity=opacity
    )

    angle = atan2(y2 - y1, x2 - x1)
    arrowSize = 7

    drawLine(
        x2, y2,
        x2 - arrowSize * cos(angle - 0.55),
        y2 - arrowSize * sin(angle - 0.55),
        fill=color,
        lineWidth=lineWidth,
        opacity=opacity
    )

    drawLine(
        x2, y2,
        x2 - arrowSize * cos(angle + 0.55),
        y2 - arrowSize * sin(angle + 0.55),
        fill=color,
        lineWidth=lineWidth,
        opacity=opacity
    )


def drawGrid(centerX, centerY, scale, width, height, color):
    for value in range(-3, 4):
        x = centerX + value * scale
        y = centerY - value * scale

        drawLine(
            x, centerY - height / 2,
            x, centerY + height / 2,
            fill=color,
            opacity=14
        )

        drawLine(
            centerX - width / 2, y,
            centerX + width / 2, y,
            fill=color,
            opacity=14
        )

    drawLine(
        centerX - width / 2, centerY,
        centerX + width / 2, centerY,
        fill='white',
        opacity=27
    )

    drawLine(
        centerX, centerY - height / 2,
        centerX, centerY + height / 2,
        fill='white',
        opacity=27
    )


def drawGlow(x, y, radius, color):
    drawCircle(x, y, radius + 12, fill=color, opacity=6)
    drawCircle(x, y, radius + 7, fill=color, opacity=10)
    drawCircle(x, y, radius + 3, fill=color, opacity=16)


def drawButton(x, y, width, height, text, fillColor):

        x, y, width, height,
        fill=fillColor,
        border='white',
        borderWidth=1,
        opacity=95
    )

    drawLabel(
        text,
        x + width / 2,
        y + height / 2,
        fill='white',
        bold=True,
        size=10
    )


def drawProgressBar(x, y, width, height, ratio, fillColor):
    drawRect(
        x, y, width, height,
        fill='black',
        border='lightSteelBlue',
        borderWidth=1
    )

    fillWidth = clamp(ratio, 0, 1) * width

    if fillWidth > 0.5:
        drawRect(
            x, y, fillWidth, height,
            fill=fillColor
        )

def getFlowColor(index, total):
    middle = total / 2
    relativeDistance = abs(index - middle) / middle

    if relativeDistance < 0.22:
        return 'tomato'
    elif relativeDistance < 0.48:
        return 'gold'
    return 'springGreen'


def drawMappedStreamlines(app):
    lineCount = len(app.mappedStreamlines)

    for index in range(lineCount):
        streamline = app.mappedStreamlines[index]
        color = getFlowColor(index, lineCount)
        previous = None

        for x, y in streamline:
            screenX, screenY = getRotatedMappedScreenPoint(app, x, y)

            if previous != None:
                currentInside = (
                    514 <= screenX <= 1012 and
                    197 <= screenY <= 545
                )

                previousInside = (
                    514 <= previous[0] <= 1012 and
                    197 <= previous[1] <= 545
                )

                if currentInside and previousInside:
                    drawLine(
                        previous[0], previous[1],
                        screenX, screenY,
                        fill=color,
                        lineWidth=1.5,
                        opacity=68
                    )

            previous = (screenX, screenY)


def drawMappedAirfoil(app):
    screenPoints = []

    for x, y in app.mappedAirfoilPoints:
        screenX, screenY = getRotatedMappedScreenPoint(app, x, y)
        screenPoints.append((screenX, screenY))

    # Golden atmospheric glow.
    for index in range(len(screenPoints) - 1):
        x1, y1 = screenPoints[index]
        x2, y2 = screenPoints[index + 1]

        drawLine(
            x1, y1, x2, y2,
            fill='gold',
            lineWidth=8,
            opacity=13
        )

    # White aerofoil boundary.
    for index in range(len(screenPoints) - 1):
        x1, y1 = screenPoints[index]
        x2, y2 = screenPoints[index + 1]

        drawLine(
            x1, y1, x2, y2,
            fill='white',
            lineWidth=2
        )

    leadingX, leadingY = getRotatedMappedScreenPoint(
        app,
        app.leadingEdge[0],
        app.leadingEdge[1]
    )

    trailingX, trailingY = getRotatedMappedScreenPoint(
        app,
        app.trailingEdge[0],
        app.trailingEdge[1]
    )

    pivotX, pivotY = getRotatedMappedScreenPoint(
        app,
        app.aerofoilPivotX,
        app.aerofoilPivotY
    )

    drawGlow(pivotX, pivotY, 4, 'gold')

    drawCircle(
        pivotX, pivotY, 4,
        fill='gold',
        border='white',
        borderWidth=1
    )

    drawLabel(
        'PIVOT',
        pivotX,
        pivotY + 16,
        fill='gold',
        bold=True,
        size=8
    )

    drawCircle(leadingX, leadingY, 4, fill='orange')
    drawCircle(trailingX, trailingY, 4, fill='tomato')

    drawLabel(
        'LE',
        leadingX + 16,
        leadingY + 15,
        fill='orange',
        bold=True,
        size=10
    )

    drawLabel(
        'TE',
        trailingX - 16,
        trailingY - 17,
        fill='tomato',
        bold=True,
        size=10
    )


def drawFlowParticles(app):
    if not app.running:
        return

    particleLines = [1, 3, 5, 8, 10, 12]

    for lineIndex in particleLines:
        if lineIndex < len(app.mappedStreamlines):
            streamline = app.mappedStreamlines[lineIndex]

            if len(streamline) > 4:
                pointIndex = int(
                    (app.particleOffset + lineIndex * 11)
                    % len(streamline)
                )

                x, y = streamline[pointIndex]

                screenX, screenY = getRotatedMappedScreenPoint(
                    app,
                    x,
                    y
                )

                if (
                    514 <= screenX <= 1012 and
                    197 <= screenY <= 545
                ):
                    drawCircle(
                        screenX, screenY, 7,
                        fill='springGreen',
                        opacity=13
                    )

                    drawCircle(
                        screenX, screenY, 3,
                        fill='white',
                        border='springGreen',
                        borderWidth=1
                    )

        app.aerofoilPivotX,

    drawLine(
        pivotX - 48, pivotY,
        pivotX + 48, pivotY,
        fill='lightSteelBlue',
        lineWidth=1,
        opacity=60,
        dashes=True

    # Direction of rotated aerofoil chord.
    angle = -app.angleOfAttack * pi / 180

    tipX = pivotX + 58 * cos(angle)
    tipY = pivotY + 58 * sin(angle)

    drawArrow(
        pivotX,
        pivotY,
        tipX,
        tipY,
        'gold',
        100,

    drawLabel(

    )

# --------------------------------------------------------------
# Messages and help
# --------------------------------------------------------------

def drawMessage(app):
    if app.messageTimer > 0:
        drawRect(
            288, 133, 474, 29,

        )

def drawHelpOverlay(app):

    )

        'AEROFOIL DESIGN MISSION',

# --------------------------------------------------------------
# Main view

def redrawAll(app):

    drawMessage(app)

# --------------------------------------------------------------
# Controller helpers
# --------------------------------------------------------------

def setMessage(app, text):
    app.message = text
    app.messageTimer = 100


def changeCirculation(app, amount):
    app.circulation = clamp(
        app.circulation + amount,
        -2.5,
        2.5
    )

    if amount > 0:
        setMessage(
            app,
            'Circulation increased: transformed flow becomes more asymmetric.'
        )
    else:
        setMessage(
            app,
            'Circulation decreased.'
        )

    rebuildCachedGeometry(app)


def changeAngle(app, amount):
    app.angleOfAttack = clamp(
        app.angleOfAttack + amount,
        -18,
        18
    )

    setMessage(
        app,
        'Aerofoil pitched to ' +
        str(app.angleOfAttack) +
        '°. Wind remains horizontal.'
    )


def changeRadius(app, amount):
    app.circleRadius = clamp(
        app.circleRadius + amount,
        0.94,
        1.30
    )

    if amount > 0:
        setMessage(
            app,
            'Generating circle enlarged: mapped profile becomes thicker.'
        )
    else:
        setMessage(
            app,
            'Generating circle reduced: mapped profile becomes thinner.'
        )

    rebuildCachedGeometry(app)


def toggleFlow(app):
    app.running = not app.running

    if app.running:
        setMessage(app, 'Tracer particles resumed.')
    else:
        setMessage(app, 'Tracer particles paused.')


def applyPreset(app, preset):
    if preset == 1:
        app.circleX = -0.10
        app.circleY = 0.00
        app.circleRadius = 1.10
        app.circulation = 0.00
        app.angleOfAttack = 0

        setMessage(
            app,
            'Preset 1: symmetric aerofoil, neutral angle, no circulation.'
        )

    elif preset == 2:
        app.circleX = -0.10
        app.circleY = 0.17
        app.circleRadius = 1.10
        app.circulation = 0.60
        app.angleOfAttack = 3

        setMessage(
            app,
            'Preset 2: cambered aerofoil at moderate positive angle.'
        )

    elif preset == 3:
        app.circleX = -0.12
        app.circleY = 0.24
        app.circleRadius = 1.14
        app.circulation = 1.20
        app.angleOfAttack = 7

        setMessage(
            app,
            'Preset 3: high-lift aerofoil. Press A/D to pitch the wing.'
        )

    rebuildCachedGeometry(app)


# --------------------------------------------------------------
# Events
# --------------------------------------------------------------

def onStep(app):
    # Geometry is cached. Animation only advances particle locations.
    if app.running:
        app.particleOffset += 0.45

    if app.messageTimer > 0:
        app.messageTimer -= 1


def onMousePress(app, mouseX, mouseY):
    if app.showHelp:
        app.showHelp = False
        return

    if 24 <= mouseX <= 79 and 99 <= mouseY <= 123:
        changeCirculation(app, 0.20)

    elif 84 <= mouseX <= 139 and 99 <= mouseY <= 123:
        changeCirculation(app, -0.20)

    elif 147 <= mouseX <= 202 and 99 <= mouseY <= 123:
        changeAngle(app, -1)

    elif 207 <= mouseX <= 262 and 99 <= mouseY <= 123:
        changeAngle(app, 1)

    elif 270 <= mouseX <= 328 and 99 <= mouseY <= 123:
        changeRadius(app, -0.04)

    elif 333 <= mouseX <= 395 and 99 <= mouseY <= 123:
        changeRadius(app, 0.04)

    elif 404 <= mouseX <= 472 and 99 <= mouseY <= 123:
        toggleFlow(app)

    elif 644 <= mouseX <= 711 and 99 <= mouseY <= 123:
        applyPreset(app, 1)

    elif 717 <= mouseX <= 787 and 99 <= mouseY <= 123:
        applyPreset(app, 2)

    elif 793 <= mouseX <= 858 and 99 <= mouseY <= 123:
        applyPreset(app, 3)

    elif 880 <= mouseX <= 942 and 99 <= mouseY <= 123:
        resetApp(app)

    elif 948 <= mouseX <= 1022 and 99 <= mouseY <= 123:
        app.showHelp = True

    else:
        handleX, handleY = sourceToScreen(
            app,
            app.circleX,
            app.circleY
        )

        if distanceBetween(mouseX, mouseY, handleX, handleY) <= 18:
            app.draggingHandle = True

            setMessage(
                app,
                'Handle engaged: drag to reshape the mapped aerofoil.'
            )


def onMouseDrag(app, mouseX, mouseY):
    if app.draggingHandle:
        sourceX, sourceY = screenToSource(app, mouseX, mouseY)

        app.circleX = clamp(sourceX, -0.38, 0.28)
        app.circleY = clamp(sourceY, -0.43, 0.43)

        rebuildCachedGeometry(app)


def onMouseRelease(app, mouseX, mouseY):
    app.draggingHandle = False


def onKeyPress(app, key):
    if key == 'h':
        app.showHelp = not app.showHelp

    elif key == 'r':
        resetApp(app)

    elif key == 'space':
        toggleFlow(app)

    elif key == 'w':
        changeCirculation(app, 0.20)

    elif key == 's':
        changeCirculation(app, -0.20)

    elif key == 'a':
        changeAngle(app, -1)

    elif key == 'd':
        changeAngle(app, 1)

    elif key == 'q':
        changeRadius(app, -0.04)

    elif key == 'e':
        changeRadius(app, 0.04)

    elif key == '1':
        applyPreset(app, 1)

    elif key == '2':
        applyPreset(app, 2)

    elif key == '3':
        applyPreset(app, 3)


def main():
    print("[DEBUG main] runApp 1050x700")
    runApp(width=1050, height=700)
    print("[DEBUG main] runApp done")

print("[DEBUG] calling main")
main()
print("[DEBUG] main done")

<script type="text/python" id="scs">

# scs.py - SANDBOX CMU_Graphics API EXACT (Brython)
# Based on CMU Graphics Guide v2 + sandbox docs
# No property decorator to avoid Brython bug, file:// safe

from browser import document, window, timer
import math

_canvas = None
_ctx = None
_app = None
_timer_id = None
_all_shapes = []
_user_funcs_global = {}
_mouse_is_down = False

def _ensure_canvas():
    global _canvas, _ctx
    if _canvas is None:
        _canvas = document.getElementById('cmu-canvas')
        if _canvas is None:
            _canvas = document.createElement('canvas')
            _canvas.id = 'cmu-canvas'
            _canvas.width = 400
            _canvas.height = 400
            document.body.appendChild(_canvas)
        _ctx = _canvas.getContext('2d')
    return _ctx

def _get_ctx():
    if _ctx is None:
        _ensure_canvas()
    return _ctx

def _clear_all_shapes():
    global _all_shapes
    _all_shapes = []

# ---------- Color ----------
def rgb(r,g,b):
    r = max(0, min(255, int(r)))
    g = max(0, min(255, int(g)))
    b = max(0, min(255, int(b)))
    return f"rgb({r},{g},{b})"

def gradient(*colors, start='center'):
    if len(colors)==0:
        return 'black'
    if len(colors)==1:
        return colors[0]
    return {'_is_gradient': True, 'colors': list(colors), 'start': start}

def _resolve_fill(ctx, fill, x, y, w, h):
    if fill is None:
        return None
    if isinstance(fill, dict) and fill.get('_is_gradient'):
        colors = fill['colors']
        start = fill.get('start','center')
        try:
            if start=='center':
                grad = ctx.createRadialGradient(x+w/2, y+h/2, 0, x+w/2, y+h/2, max(w,h)/2)
            elif start=='top':
                grad = ctx.createLinearGradient(x, y, x, y+h)
            elif start=='left':
                grad = ctx.createLinearGradient(x, y, x+w, y)
            elif start=='bottom':
                grad = ctx.createLinearGradient(x, y+h, x, y)
            elif start=='right':
                grad = ctx.createLinearGradient(x+w, y, x, y)
            else:
                grad = ctx.createLinearGradient(x, y, x+w, y+h)
            for i,c in enumerate(colors):
                off = i/(len(colors)-1) if len(colors)>1 else 0
                grad.addColorStop(off, c)
            return grad
        except:
            return colors[0]
    return fill

def _apply_dashes(ctx, dashes):
    try:
        if dashes is True:
            ctx.setLineDash([6,4])
        elif isinstance(dashes, (list,tuple)):
            ctx.setLineDash(list(dashes))
        elif isinstance(dashes, int):
            ctx.setLineDash([dashes, dashes])
        elif dashes is False or dashes is None:
            ctx.setLineDash([])
        else:
            ctx.setLineDash([])
    except:
        pass

# ---------- Utils - sandbox exact ----------
def distance(x1,y1,x2,y2):
    return math.sqrt((x2-x1)**2 + (y2-y1)**2)

def angleTo(x1,y1,x2,y2):
    # 0 = straight up, clockwise - per guide
    dx = x2-x1
    dy = y1-y2
    ang = math.degrees(math.atan2(dx, dy))
    if ang < 0:
        ang += 360
    return ang

def getPointInDir(x1,y1,angle,length):
    rad = math.radians(angle)
    x2 = x1 + length * math.sin(rad)
    y2 = y1 - length * math.cos(rad)
    return (x2, y2)

def rounded(n):
    return round(n)

def makeList(rows, cols=None):
    if cols is None:
        return [None]*rows
    return [[None]*cols for _ in range(rows)]

def getImageSize(url):
    try:
        img = window.Image.new()
        img.src = url
        w = getattr(img, 'width', 0)
        h = getattr(img, 'height', 0)
        if w and h:
            return (w, h)
    except:
        pass
    return (100, 100)

# ---------- Shape base - no property decorator ----------
class Shape:
    def __init__(self, **kwargs):
        object.__setattr__(self, 'fill', kwargs.get('fill', 'black'))
        object.__setattr__(self, 'border', kwargs.get('border', None))
        object.__setattr__(self, 'borderWidth', kwargs.get('borderWidth', 2))
        object.__setattr__(self, 'opacity', kwargs.get('opacity', 100))
        object.__setattr__(self, 'rotateAngle', kwargs.get('rotateAngle', 0))
        object.__setattr__(self, 'visible', kwargs.get('visible', True))
        object.__setattr__(self, 'dashes', kwargs.get('dashes', False))
        object.__setattr__(self, 'align', kwargs.get('align', 'center'))
        object.__setattr__(self, 'lineWidth', kwargs.get('lineWidth', kwargs.get('borderWidth', 2)))
        object.__setattr__(self, 'arrowStart', kwargs.get('arrowStart', False))
        object.__setattr__(self, 'arrowEnd', kwargs.get('arrowEnd', False))
        object.__setattr__(self, 'roundness', kwargs.get('roundness', 0))
        _all_shapes.append(self)
    def toFront(self):
        if self in _all_shapes:
            _all_shapes.remove(self)
            _all_shapes.append(self)
    def toBack(self):
        if self in _all_shapes:
            _all_shapes.remove(self)
            _all_shapes.insert(0, self)
    def contains(self, x, y):
        return self.hits(x,y)
    def hits(self, x, y):
        return False
    def hitsShape(self, other):
        return False
    def __setattr__(self, name, value):
        object.__setattr__(self, name, value)

# ---------- Rect - sandbox: left, top, width, height ----------
class Rect(Shape):
    def __init__(self, left, top, width, height, fill=None, border=None, borderWidth=2, opacity=100, rotateAngle=0, visible=True, dashes=False, align='leftTop', roundness=0, **kw):
        object.__setattr__(self, 'left', left)
        object.__setattr__(self, 'top', top)
        object.__setattr__(self, 'width', width)
        object.__setattr__(self, 'height', height)
        object.__setattr__(self, 'align', align)
        object.__setattr__(self, 'roundness', roundness)
        Shape.__init__(self, fill=fill if fill is not None else 'black', border=border, borderWidth=borderWidth, opacity=opacity, rotateAngle=rotateAngle, visible=visible, dashes=dashes, **kw)
        self._sync()
    def _sync(self):
        # derive center, right, bottom
        object.__setattr__(self, 'centerX', self.left + self.width/2)
        object.__setattr__(self, 'centerY', self.top + self.height/2)
        object.__setattr__(self, 'right', self.left + self.width)
        object.__setattr__(self, 'bottom', self.top + self.height)
    def __setattr__(self, name, value):
        object.__setattr__(self, name, value)
        if name in ('left','top','width','height','centerX','centerY','right','bottom'):
            # keep in sync
            try:
                if name == 'centerX':
                    object.__setattr__(self, 'left', value - self.width/2)
                elif name == 'centerY':
                    object.__setattr__(self, 'top', value - self.height/2)
                elif name == 'right':
                    object.__setattr__(self, 'left', value - self.width)
                elif name == 'bottom':
                    object.__setattr__(self, 'top', value - self.height)
                # re-sync derived
                if hasattr(self, 'width'):
                    object.__setattr__(self, 'centerX', self.left + self.width/2)
                    object.__setattr__(self, 'centerY', self.top + self.height/2)
                    object.__setattr__(self, 'right', self.left + self.width)
                    object.__setattr__(self, 'bottom', self.top + self.height)
            except:
                pass
    def hits(self, x, y):
        return self.left <= x <= self.left+self.width and self.top <= y <= self.top+self.height
    def draw(self, ctx):
        if not getattr(self, 'visible', True):
            return
        ctx.save()
        if self.opacity != 100:
            ctx.globalAlpha = self.opacity/100
        if self.rotateAngle:
            ctx.translate(self.centerX, self.centerY)
            ctx.rotate(self.rotateAngle*math.pi/180)
            ctx.translate(-self.centerX, -self.centerY)
        _apply_dashes(ctx, self.dashes)
        fill = _resolve_fill(ctx, self.fill, self.left, self.top, self.width, self.height)
        if fill:
            ctx.fillStyle = fill
            r = getattr(self, 'roundness', 0)
            if r:
                # simple rounded rect
                try:
                    rr = min(r, self.width/2, self.height/2)
                    ctx.beginPath()
                    ctx.roundRect(self.left, self.top, self.width, self.height, rr)
                    ctx.fill()
                except:
                    ctx.fillRect(self.left, self.top, self.width, self.height)
            else:
                ctx.fillRect(self.left, self.top, self.width, self.height)
        if self.border:
            ctx.strokeStyle = self.border
            ctx.lineWidth = self.borderWidth
            ctx.strokeRect(self.left, self.top, self.width, self.height)
        ctx.restore()
        _apply_dashes(ctx, False)

class Oval(Shape):
    def __init__(self, centerX, centerY, width, height, fill=None, border=None, borderWidth=2, opacity=100, rotateAngle=0, visible=True, dashes=False, align='center', **kw):
        object.__setattr__(self, 'centerX', centerX)
        object.__setattr__(self, 'centerY', centerY)
        object.__setattr__(self, 'width', width)
        object.__setattr__(self, 'height', height)
        object.__setattr__(self, 'align', align)
        Shape.__init__(self, fill=fill if fill is not None else 'black', border=border, borderWidth=borderWidth, opacity=opacity, rotateAngle=rotateAngle, visible=visible, dashes=dashes, **kw)
    def hits(self, x, y):
        dx = (x-self.centerX)/(self.width/2) if self.width else 0
        dy = (y-self.centerY)/(self.height/2) if self.height else 0
        return dx*dx+dy*dy <= 1
    def draw(self, ctx):
        if not self.visible:
            return
        ctx.save()
        if self.opacity != 100:
            ctx.globalAlpha = self.opacity/100
        if self.rotateAngle:
            ctx.translate(self.centerX, self.centerY)
            ctx.rotate(self.rotateAngle*math.pi/180)
            ctx.translate(-self.centerX, -self.centerY)
        _apply_dashes(ctx, self.dashes)
        ctx.beginPath()
        ctx.ellipse(self.centerX, self.centerY, self.width/2, self.height/2, 0, 0, 2*math.pi)
        fill = _resolve_fill(ctx, self.fill, self.centerX-self.width/2, self.centerY-self.height/2, self.width, self.height)
        if fill:
            ctx.fillStyle = fill
            ctx.fill()
        if self.border:
            ctx.strokeStyle = self.border
            ctx.lineWidth = self.borderWidth
            ctx.stroke()
        ctx.restore()
        _apply_dashes(ctx, False)

class Circle(Oval):
    def __init__(self, centerX, centerY, radius, fill=None, border=None, borderWidth=2, opacity=100, rotateAngle=0, visible=True, dashes=False, align='center', **kw):
        super().__init__(centerX, centerY, radius*2, radius*2, fill=fill, border=border, borderWidth=borderWidth, opacity=opacity, rotateAngle=rotateAngle, visible=visible, dashes=dashes, align=align, **kw)
        object.__setattr__(self, 'radius', radius)
    def __setattr__(self, name, value):
        object.__setattr__(self, name, value)
        if name == 'radius':
            object.__setattr__(self, 'width', value*2)
            object.__setattr__(self, 'height', value*2)

class Line(Shape):
    def __init__(self, x1, y1, x2, y2, fill=None, border=None, lineWidth=1, opacity=100, rotateAngle=0, visible=True, dashes=False, arrowStart=False, arrowEnd=False, **kw):
        object.__setattr__(self, 'x1', x1)
        object.__setattr__(self, 'y1', y1)
        object.__setattr__(self, 'x2', x2)
        object.__setattr__(self, 'y2', y2)
        object.__setattr__(self, 'lineWidth', lineWidth)
        object.__setattr__(self, 'dashes', dashes)
        object.__setattr__(self, 'arrowStart', arrowStart)
        object.__setattr__(self, 'arrowEnd', arrowEnd)
        Shape.__init__(self, fill=fill if fill is not None else 'black', border=border, borderWidth=lineWidth, opacity=opacity, rotateAngle=rotateAngle, visible=visible, **kw)
    def draw(self, ctx):
        if not self.visible:
            return
        ctx.save()
        if self.opacity != 100:
            ctx.globalAlpha = self.opacity/100
        _apply_dashes(ctx, self.dashes)
        ctx.beginPath()
        ctx.moveTo(self.x1, self.y1)
        ctx.lineTo(self.x2, self.y2)
        ctx.strokeStyle = self.fill if self.fill else 'black'
        ctx.lineWidth = self.lineWidth
        ctx.stroke()
        # arrows
        def draw_arrow(x, y, angle):
            size=8
            ctx.beginPath()
            ctx.moveTo(x, y)
            ctx.lineTo(x-size*math.cos(angle-0.4), y-size*math.sin(angle-0.4))
            ctx.lineTo(x-size*math.cos(angle+0.4), y-size*math.sin(angle+0.4))
            ctx.closePath()
            ctx.fillStyle = ctx.strokeStyle
            ctx.fill()
        ang = math.atan2(self.y2-self.y1, self.x2-self.x1)
        if self.arrowEnd:
            draw_arrow(self.x2, self.y2, ang)
        if self.arrowStart:
            draw_arrow(self.x1, self.y1, ang+math.pi)
        ctx.restore()
        _apply_dashes(ctx, False)

class Polygon(Shape):
    def __init__(self, *points, fill=None, border=None, borderWidth=2, opacity=100, rotateAngle=0, visible=True, dashes=False, **kw):
        # points as x1,y1,x2,y2,...
        object.__setattr__(self, 'points', list(points))
        Shape.__init__(self, fill=fill if fill is not None else 'black', border=border, borderWidth=borderWidth, opacity=opacity, rotateAngle=rotateAngle, visible=visible, dashes=dashes, **kw)
    def draw(self, ctx):
        if not self.visible or len(self.points)<4:
            return
        ctx.save()
        if self.opacity != 100:
            ctx.globalAlpha = self.opacity/100
        _apply_dashes(ctx, self.dashes)
        ctx.beginPath()
        ctx.moveTo(self.points[0], self.points[1])
        for i in range(2, len(self.points), 2):
            ctx.lineTo(self.points[i], self.points[i+1])
        ctx.closePath()
        fill = _resolve_fill(ctx, self.fill, 0,0,100,100)
        if fill:
            ctx.fillStyle = fill
            ctx.fill()
        if self.border:
            ctx.strokeStyle = self.border
            ctx.lineWidth = self.borderWidth
            ctx.stroke()
        ctx.restore()
        _apply_dashes(ctx, False)

class RegularPolygon(Polygon):
    def __init__(self, centerX, centerY, radius, points, fill=None, border=None, borderWidth=2, opacity=100, rotateAngle=0, visible=True, **kw):
        pts=[]
        for i in range(points):
            ang = math.radians(rotateAngle + i*360/points - 90)
            pts.append(centerX+radius*math.cos(ang))
            pts.append(centerY+radius*math.sin(ang))
        object.__setattr__(self, 'centerX', centerX)
        object.__setattr__(self, 'centerY', centerY)
        object.__setattr__(self, 'radius', radius)
        object.__setattr__(self, 'points_count', points)
        super().__init__(*pts, fill=fill, border=border, borderWidth=borderWidth, opacity=opacity, rotateAngle=0, visible=visible, **kw)

class Star(Shape):
    def __init__(self, centerX, centerY, radius, points, roundness=0, fill=None, border=None, borderWidth=2, opacity=100, rotateAngle=0, visible=True, **kw):
        object.__setattr__(self, 'centerX', centerX)
        object.__setattr__(self, 'centerY', centerY)
        object.__setattr__(self, 'radius', radius)
        object.__setattr__(self, 'points', points)
        object.__setattr__(self, 'roundness', roundness)
