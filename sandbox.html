<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>SCS Sandbox</title>
<style>
body{margin:0;padding:10px;background:#0f1115;color:#e6e6e6;font-family:monospace;display:flex;flex-direction:column;align-items:center;}
#canvas-container{border:2px solid #3a3f4b;border-radius:8px;background:#000;}
canvas{display:block;background:black;outline:none;}
#controls{margin-top:12px;width:1050px;max-width:98vw;}
textarea{width:100%;height:400px;background:#1a1d24;color:#d6deeb;border:1px solid #3a3f4b;border-radius:6px;padding:12px;font-family:monospace;font-size:11px;}
button{background:#4c6ef5;color:white;border:0;padding:10px 18px;border-radius:6px;cursor:pointer;font-weight:600;margin-right:8px;}
#log{margin-top:10px;background:#1a1d24;border:1px solid #3a3f4b;border-radius:6px;padding:10px;min-height:80px;white-space:pre-wrap;font-size:11px;max-height:300px;overflow:auto;}
</style>
<script src="https://cdn.jsdelivr.net/npm/brython@3.11.3/brython.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/brython@3.11.3/brython_stdlib.js"></script>
<link rel="icon" type="image/png" href="/scs/favicon.png">
</head>
<body onload="brython({debug:1, pythonpath:['.']})">
<div id="canvas-container"><canvas id="canvas" width="400" height="400" tabindex="0"></canvas></div>
<div id="controls">
<textarea id="code-input">from scs import *

def onAppStart(app):
    app.dots = []
    app.color = 'blue'

def redrawAll(app):
    for cx, cy in app.dots:
        drawCircle(cx, cy, 20, fill=app.color)

def onMousePress(app, mouseX, mouseY):
    app.dots.append((mouseX, mouseY))

def onKeyPress(app, key):
    if key == 'r':
        app.color = 'red'
    elif key == 'b':
        app.color = 'blue'

def main():
    runApp()

main()
</textarea>
<div style="margin-top:8px;"><button id="run-btn">▶ Run</button><button id="stop-btn">■ Stop</button></div>
<div id="log"></div>
</div>

<script type="text/python" id="main">
from browser import document, timer
import scs
import traceback

_log = document['log']
_code_area = document['code-input']
scs._ensure_canvas()
_canvas = scs._canvas
_user_funcs = {}
_app_timer = None
_user_ns = {}
_callback_names = (
    'onAppStart', 'redrawAll', 'onStep', 'onMousePress', 'onMouseRelease',
    'onMouseMove', 'onMouseDrag', 'onKeyPress', 'onKeyRelease', 'onKeyHold'
)

def log(message):
    _log.text += str(message) + '\n'
    print(message)

def _call_callback(name, *args):
    callback = _user_funcs.get(name)
    if callback is None:
        return
    try:
        callback(*args)
    except Exception:
        log(f'{name} failed:\n{traceback.format_exc()}')

def _mouse_position(event):
    rect = _canvas.getBoundingClientRect()
    scale_x = _canvas.width / rect.width if rect.width else 1
    scale_y = _canvas.height / rect.height if rect.height else 1
    return ((event.clientX - rect.left) * scale_x,
            (event.clientY - rect.top) * scale_y)

def _on_mouse_press(event):
    _canvas.focus()
    if scs._app is not None:
        _call_callback('onMousePress', scs._app, *_mouse_position(event))

def _on_mouse_move(event):
    if scs._app is not None:
        _call_callback('onMouseMove', scs._app, *_mouse_position(event))

def _on_key_press(event):
    if event.target != _canvas or scs._app is None:
        return
    key = 'space' if event.key == ' ' else event.key.lower()
    _call_callback('onKeyPress', scs._app, key)

_canvas.bind('mousedown', _on_mouse_press)
_canvas.bind('mousemove', _on_mouse_move)
document.bind('keydown', _on_key_press)

def stop_app():
    global _app_timer
    if _app_timer is not None:
        timer.clear_interval(_app_timer)
        _app_timer = None

def sandbox_run_app(width=400, height=400, stepsPerSecond=30):
    global _user_funcs, _app_timer
    stop_app()
    _user_funcs = {
        name: _user_ns[name]
        for name in _callback_names
        if callable(_user_ns.get(name))
    }
    _canvas.setAttribute('width', str(width))
    _canvas.setAttribute('height', str(height))
    _canvas.style.width = f'{width}px'
    _canvas.style.height = f'{height}px'
    scs._ctx = _canvas.getContext('2d')
    scs._app = scs.App(width, height)
    scs._app.stepsPerSecond = stepsPerSecond
    _call_callback('onAppStart', scs._app)

    def frame():
        try:
            if 'onStep' in _user_funcs and not scs._app.paused:
                _call_callback('onStep', scs._app)
            scs._ctx.clearRect(0, 0, width, height)
            if scs._app.background:
                scs._ctx.fillStyle = scs._app.background
                scs._ctx.fillRect(0, 0, width, height)
            _call_callback('redrawAll', scs._app)
            for shape in list(scs._shapes):
                shape.draw(scs._ctx)
        except Exception:
            log(f'Frame failed:\n{traceback.format_exc()}')
            stop_app()

    frame()
    interval = int(1000 / stepsPerSecond) if stepsPerSecond > 0 else 33
    _app_timer = timer.set_interval(frame, interval)
    log(f'Running {width}x{height} at {stepsPerSecond} fps; canvas={_canvas.width}x{_canvas.height}')

def exec_user_code(event=None):
    global _user_ns
    stop_app()
    _log.text = ''
    _user_ns = {'__builtins__': __builtins__}
    scs.runApp = sandbox_run_app
    try:
        exec(_code_area.value, _user_ns)
    except Exception:
        log(f'Error:\n{traceback.format_exc()}')

document['run-btn'].bind('click', exec_user_code)
document['stop-btn'].bind('click', lambda event: stop_app())
log('Sandbox ready. The graphics API is loaded from root scs.py.')
</script>
</body>
</html>
