<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>SCS Sandbox</title>
<style>
body{margin:0;padding:10px;background:#0f1115;color:#e6e6e6;font-family:monospace;display:flex;flex-direction:column;align-items:center;}
canvas{display:block;background:black;outline:none;}
#code-input{width:1050px;max-width:98vw;height:400px;background:#1a1d24;color:#d6deeb;border:1px solid #3a3f4b;border-radius:6px;padding:12px;font-family:monospace;font-size:11px;}
</style>
<script src="https://cdn.jsdelivr.net/npm/brython@3.11.3/brython.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/brython@3.11.3/brython_stdlib.js"></script>
</head>
<body onload="brython({debug:1, pythonpath:['..', '../scs']})">
<canvas id="canvas" width="400" height="400" tabindex="0"></canvas>
<!-- Sandbox: just enter app code here. Paste CMU-style code, it auto-runs. -->
<textarea id="code-input" placeholder="Just enter app code here...\n\nfrom scs import *\n\ndef onAppStart(app):\n    app.color = 'blue'\n\ndef redrawAll(app):\n    drawCircle(200, 200, 50, fill=app.color)\n\nrunApp()"></textarea>
<script type="text/python">
# Thin shell only. No loop, no events, no renderer, no shape drawing here.
# All of that is baked into the package (scs_entrypoint.py).
# Users just import from npm or load from CDN.
import scs_entrypoint as ep
ep.boot_sandbox()
</script>
</body></html>
