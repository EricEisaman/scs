# netlify.toml -- SCS on Netlify, static only.
#
# Root cause of the live-site error:
#   brython.min.js: File "./scs_3d.py", line 1, <!DOCTYPE html> ^ SyntaxError
# Netlify returned index.html for /scs_3d.py. That happens only when
# the /* -> /index.html rewrite swallows a missing .py 404 and turns
# it into a 200 HTML response. Brython then parses HTML as Python.
#
# Fix: NO generic /* rewrite. Only explicit rewrites.
# /?app=... needs no rewrite: path is /, it serves index.html directly.
# Missing .py must 404, never HTML. Build fails if the .py files are
# not at publish root, so a broken deploy never ships.
#
# Publish is the repo root: index.html, sandbox.html, scs_*.py,
# apps/ all live here. In Netlify UI, Publish directory must be
# blank or "." -- if UI says "scs" or "dist", it overrides this file
# and /scs_3d.py 404s (then used to return index.html).

[build]
  publish = "."
  command = "test -f scs_3d.py && test -f scs_entrypoint.py && test -f scs.py && test -f index.html && test -f sandbox.html && echo 'SCS deploy files OK: scs_3d.py scs_entrypoint.py scs.py index.html sandbox.html at publish root' || (echo 'FATAL: Brython .py files missing from publish root. Commit scs_3d.py / scs_entrypoint.py / scs.py at repo root and set Netlify Publish directory to . -- not scs, not dist.' && exit 1)"

# /sandbox -> /sandbox.html. The sandbox page is sandbox.html at the
# root. These are the ONLY rewrites. No /* rewrite.
[[redirects]]
  from = "/sandbox"
  to = "/sandbox.html"
  status = 200

[[redirects]]
  from = "/sandbox/"
  to = "/sandbox.html"
  status = 200

# .py is source, not a build artifact. Serve as text, never cache:
# a cached scs_entrypoint.py is how the old runApp(stepsPerSecond)
# TypeError survived a deploy. Same for .html shells.
[[headers]]
  for = "*.py"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    Cache-Control = "no-store"

[[headers]]
  for = "*.html"
  [headers.values]
    Cache-Control = "no-store"

[[headers]]
  for = "/apps/*"
  [headers.values]
    Cache-Control = "no-store"
