[project]
name = "scs-datastar-extension"
version = "0.1.0"
description = "SCS Fullstack Extension - Datastar SSE + Brython 2D Platformer Multiplayer (No WebSockets)"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [{name="SCS Team"}]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "datastar-py>=1.0.0",
    "pydantic>=2",
    "pydantic-settings>=2",
    "jinja2>=3.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]